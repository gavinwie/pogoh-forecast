name: collect

on:
  schedule:
    # Best-effort: GitHub may delay or skip runs under load. Gaps are expected
    # and handled downstream, not treated as bugs.
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Never run two collectors at once (they would race on the data branch push).
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out code (main)
        uses: actions/checkout@v4

      - name: Check out data branch
        uses: actions/checkout@v4
        with:
          ref: data
          path: data_branch

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect snapshot
        env:
          PYTHONPATH: src
        run: python -m bikecast.collect --out data_branch

      - name: Commit and push to data branch
        working-directory: data_branch
        run: |
          git config user.name "bikecast-bot"
          git config user.email "bikecast-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          for attempt in 1 2 3; do
            if git push origin data; then
              exit 0
            fi
            echo "push failed (attempt $attempt), rebasing and retrying"
            git pull --rebase origin data
            sleep 3
          done
          echo "could not push after 3 attempts" >&2
          exit 1
